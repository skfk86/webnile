name: Create signing key

# Run once from Termux:  bash webnile-setup.sh keystore
# The key is generated on GitHub's server (Java is already there),
# so nothing needs to be installed on the phone.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          mkdir out
          keytool -genkeypair -keystore out/webnile.jks -alias webnile \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Web Nile, OU=Mobile, O=Web Nile, C=SD"
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=webnile\n' "$PASS" "$PASS" > out/webnile.env

      - name: Upload (expires after 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: webnile-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
