<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B1F2A">
<title>ويب نايل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F6F5;--card:#fff;--ink:#0B1F2A;--mute:#5E7480;--line:#DCE7E6;--nile:#0E7C86;--nile2:#12B5A6;--sun:#F5B83D;--bad:#D64545;--deep:#0B1F2A;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace}
@media(prefers-color-scheme:dark){:root{--bg:#08161D;--card:#102630;--ink:#EAF4F3;--mute:#8FA8B2;--line:#1D3844;--deep:#050E13}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.75}
body{padding-bottom:calc(76px + var(--sb));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
.hero{background:var(--deep);color:#EAF4F3;padding:calc(var(--st) + 22px) 20px 30px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:-40px;bottom:-26px;width:260px;height:60px;border-radius:50%;border-top:3px solid rgba(18,181,166,.5);box-shadow:0 14px 0 -1px rgba(18,181,166,.25),0 28px 0 -2px rgba(18,181,166,.12)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px}
.logo .lg{width:38px;height:38px;border-radius:11px;flex:none;display:block}
.logo b{color:var(--sun)}
.hero p{margin:6px 0 18px;color:#9DB8C0;font-size:14px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:rgba(255,255,255,.07);border-radius:16px;padding:10px 12px}
.stat span{display:flex;align-items:center;gap:5px;font-size:12px;color:#9DB8C0}
.stat b{font-size:20px;font-weight:900}
.stat.f .i{color:var(--sun)}.stat.z .i{color:var(--nile2)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(-90deg,var(--nile2),var(--sun));border-radius:8px;transition:width .5s}
.h2{font-size:19px;font-weight:900;margin:26px 18px 4px}
.path{position:relative;padding:12px 0 6px}
.path:before{content:"";position:absolute;top:0;bottom:0;right:50%;border-right:3px dashed var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;width:260px;margin:0 auto 18px;text-align:right}
.node:nth-child(even){transform:translateX(-46px)}.node:nth-child(odd){transform:translateX(46px)}
.dot{flex:none;width:62px;height:62px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;color:var(--mute);z-index:1;transition:transform .15s}
.dot .i{width:26px;height:26px}
.node:active .dot{transform:scale(.93)}
.node.done .dot{background:var(--nile);border-color:var(--nile);color:#fff}
.node.locked{opacity:.6}.node.locked .dot{background:var(--bg);border-color:var(--mute);color:var(--mute)}.node.locked .t{color:var(--mute)}
.node.next .dot{border-color:var(--sun);color:var(--ink);box-shadow:0 0 0 6px rgba(245,184,61,.22);animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 12px rgba(245,184,61,0)}}
.node .t{background:var(--card);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;line-height:1.45;box-shadow:0 1px 0 var(--line)}
.node .t small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.page{padding:0 16px}
.bar2{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 12px) 12px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar2 h1{font-size:18px;margin:0;font-weight:900;flex:1;line-height:1.3}
.bar2 h1 small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.ib{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:0 1px 0 var(--line);display:grid;place-items:center}
.card{background:var(--card);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:0 1px 0 var(--line)}
.card p{margin:0 0 10px}.card p:last-child{margin:0}
code{direction:ltr;unicode-bidi:embed;font-family:var(--mono);font-size:.86em;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--nile)}
@media(prefers-color-scheme:dark){code{color:var(--nile2)}}
.ex{direction:ltr;text-align:left;margin:4px 0 12px;padding:12px 14px;background:var(--deep);color:#D8EEF0;border-radius:14px;font:13px/1.65 var(--mono);white-space:pre;overflow-x:auto}
.tip{display:flex;gap:10px;background:rgba(245,184,61,.14);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.tip .i{color:#C98A0B;margin-top:3px}
.task{border:2px solid var(--sun);background:transparent}
.task h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:15px;font-weight:900}
.task h3 .i{color:var(--sun)}
.chk{list-style:none;margin:8px 0 0;padding:0}
.chk li{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);padding:2px 0}
.chk li:before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.chk li.ok{color:var(--ink)}.chk li.ok:before{background:var(--nile2);border-color:var(--nile2);box-shadow:inset 0 0 0 3px var(--card)}
.chk li.no:before{border-color:var(--bad)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:4px 0 10px}
.seg button{flex:1;padding:7px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--deep);color:#fff}
.ide,.pv{background:#0A1A22;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.tabs{display:flex;align-items:center;gap:10px;background:#07141A;padding:9px 14px;direction:ltr}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#FF5F57}.dots i:nth-child(2){background:#FEBC2E}.dots i:nth-child(3){background:#28C840}
.fn{font:12px var(--mono);color:#9DB8C0;background:#0A1A22;padding:3px 10px;border-radius:8px}
.code{position:relative;display:flex;height:270px;direction:ltr}
.gut{flex:none;width:40px;padding:12px 8px 12px 0;text-align:right;color:#3E5966;font:14px/22px var(--mono);white-space:pre;overflow:hidden;background:#08171E;user-select:none}
.wrap{position:relative;flex:1}
.hl,.ed{position:absolute;inset:0;margin:0;padding:12px;border:0;font:14px/22px var(--mono);white-space:pre;tab-size:2;letter-spacing:0;direction:ltr;text-align:left;word-wrap:normal}
.hl{overflow:hidden;color:#D8EEF0;pointer-events:none}
.ed{overflow:auto;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--sun);resize:none;outline:0}
.ed::selection{background:rgba(18,181,166,.35)}
.hl i{font-style:normal}
.hl .c{color:#5E7A86;font-style:italic}.hl .t{color:#FF7B9C}.hl .a{color:#F5B83D}.hl .s{color:#86EFAC}.hl .p{color:#6F8C98}.hl .sl{color:#7DD3FC}.hl .pr{color:#C4B5FD}.hl .n{color:#FDBA74}
.ex .c{color:#5E7A86;font-style:italic}.ex .t{color:#FF7B9C}.ex .a{color:#F5B83D}.ex .s{color:#86EFAC}.ex .p{color:#6F8C98}.ex .sl{color:#7DD3FC}.ex .pr{color:#C4B5FD}.ex .n{color:#FDBA74}
.ex i{font-style:normal}.ex .c{font-style:italic}
.frame{width:100%;height:270px;border:0;background:#fff;display:block}
.addr{font:12px var(--mono);color:#9DB8C0;flex:1;text-align:center;background:#0A1A22;padding:3px;border-radius:8px}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px 0;direction:ltr;scrollbar-width:none}
.keys button{flex:none;min-width:42px;height:38px;border-radius:10px;background:var(--card);font:700 15px var(--mono);box-shadow:0 1px 0 var(--line)}
.sug{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;direction:ltr;scrollbar-width:none;min-height:46px;align-items:center}
.sug button{flex:none;height:38px;padding:0 12px;border-radius:10px;background:var(--deep);color:#D8EEF0;font:600 14px var(--mono);border-left:3px solid var(--nile2)}
.sug button[data-t=t]{border-color:#FF7B9C}.sug button[data-t=a]{border-color:#F5B83D}.sug button[data-t=s],.sug button[data-t=v]{border-color:#86EFAC}.sug button[data-t=p]{border-color:#C4B5FD}
.sug .h{color:var(--mute);font-size:12px;direction:rtl}
.con{margin:0;padding:12px 14px;min-height:230px;max-height:320px;overflow:auto;background:#07141A;color:#D8EEF0;font:14px/1.7 var(--mono);direction:ltr;text-align:left;white-space:pre-wrap}
.con div{border-bottom:1px solid rgba(255,255,255,.05)}.con .er{color:#FF7B9C}.con .mu{color:#6F8C98;font-family:'Cairo',system-ui,sans-serif;direction:rtl;text-align:right;border:0}
.frame.sm{height:170px}
.hide{display:none}
.off{position:absolute;right:-9999px;top:0;width:320px;opacity:0;pointer-events:none}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:12px;border-radius:14px;font-weight:900;background:var(--card);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--nile);color:#fff}.btn.s{background:var(--sun);color:#0B1F2A}
.btn:active{transform:scale(.97)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:6px 14px;border-radius:99px;background:var(--card);font-size:13px;font-weight:700;box-shadow:0 1px 0 var(--line);display:flex;gap:4px;align-items:center}
nav{position:fixed;bottom:0;right:0;left:0;height:calc(66px + var(--sb));padding-bottom:var(--sb);background:var(--card);display:flex;border-top:1px solid var(--line);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute)}
nav button .i{width:24px;height:24px;margin-bottom:2px}
nav button.on{color:var(--nile)}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--sb));--bh:0px;bottom:calc(86px + var(--sb) + var(--bh));transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:99;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.good{background:var(--nile)}.toast.bad{background:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:all}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + var(--sb));width:100%;max-width:480px;text-align:center;transform:translateY(60px);transition:transform .3s}
.overlay.show .sheet{transform:translateY(0)}
.sheet h3{margin:0 0 8px;font-size:18px;font-weight:900}
.sheet p{color:var(--mute);font-size:14px;margin:0 0 20px}
.sheet-btns{display:flex;gap:10px}
.sheet-btns button{flex:1;padding:12px;border-radius:16px;font-weight:700;font-size:15px}
.big{font-size:34px;font-weight:900;margin:0}
.tr{margin:10px 0}.tr .b{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:4px}.tr .b i{display:block;height:100%;background:var(--nile2);border-radius:10px}
.tr div:first-child{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const gcs=(d,q)=>d.defaultView.getComputedStyle(d.querySelector(q));
const px=v=>parseFloat(v)||0;

/* ---------- Syntax highlighting ---------- */
const hH=s=>s.replace(/<!\-\-[\s\S]*?\-\->|<![^>]*>?|<\/?[\w-]+(?:"[^"]*"|'[^']*'|[^>"'])*>?|[^<]+|</g,m=>{
  if(m.slice(0,2)==='<!')return `<i class=c>${esc(m)}</i>`;
  if(m[0]!=='<'||m==='<')return esc(m);
  const t=m.match(/^(<\/?)([\w-]+)([\s\S]*?)(\/?>?)$/);
  const at=esc(t[3]).replace(/("[^"]*"|'[^']*')|([\w:-]+)(?==)/g,(x,st,n)=>st?`<i class=s>${st}</i>`:`<i class=a>${n}</i>`);
  return `<i class=p>${esc(t[1])}</i><i class=t>${t[2]}</i>${at}<i class=p>${esc(t[4])}</i>`;
});
const hC=s=>s.replace(/\/\*[\s\S]*?\*\/|[^{};]+\{|[{};]|[^{};]+/g,m=>{
  if(m.slice(0,2)==='/*')return `<i class=c>${esc(m)}</i>`;
  if(m.length>1&&m.slice(-1)==='{')return `<i class=sl>${esc(m.slice(0,-1))}</i><i class=p>{</i>`;
  if(/^[{};]$/.test(m))return `<i class=p>${m}</i>`;
  const d=m.match(/^(\s*)([\w-]+)(\s*:\s*)([\s\S]*)$/);
  if(!d)return esc(m);
  return d[1]+`<i class=pr>${d[2]}</i>`+esc(d[3])+esc(d[4]).replace(/#[0-9a-fA-F]{3,8}\b|-?\d*\.?\d+(?:px|em|rem|%|vh|vw|s|fr|deg)?/g,x=>`<i class=n>${x}</i>`);
});
function hl(s){let o='',i=0,m;const re=/(<style[^>]*>)([\s\S]*?)(<\/style>|$)/gi;
  while((m=re.exec(s))){o+=hH(s.slice(i,m.index))+hH(m[1])+hC(m[2])+hH(m[3]);i=m.index+m[0].length}
  return o+hH(s.slice(i))}

/* ---------- Lessons ---------- */
const TRACKS={html:'HTML — هيكل الصفحة',css:'CSS — شكل الصفحة',js:'JavaScript — حياة الصفحة',pro:'مشروع التخرج'};
const LESSONS=[
{id:'h1',k:'html',ic:'heading',t:'العناوين والفقرات',body:[
'HTML ليست لغة برمجة، بل لغة **وصف**: تخبر المتصفح بما يوجد في الصفحة (عنوان، فقرة، صورة) دون أن تحدد شكله. الشكل مهمة CSS.',
'كل عنصر يتكون من وسم فتح، ثم محتوى، ثم وسم إغلاق يحمل شرطة مائلة:',{c:'<p>هذه فقرة</p>'},
'للعناوين ستة مستويات من `<h1>` (الأهم) إلى `<h6>` (الأقل أهمية). استخدم `<h1>` مرة واحدة فقط لعنوان الصفحة، ثم رتّب ما بعده تنازلياً:',{c:'<h1>ويب نايل</h1>\n<h2>الدرس الأول</h2>\n<p>أهلاً بك في عالم الويب.</p>'},
{tip:'لا تختر العنوان حسب حجمه. الحجم يتحكم فيه CSS لاحقاً، أما رقم العنوان فيعبّر عن أهميته في بنية الصفحة، وتعتمد عليه محركات البحث وقارئات الشاشة.'}],
task:'اكتب عنواناً `<h1>` وتحته عنواناً فرعياً `<h2>` ثم فقرة `<p>`، وضع في كل منها نصاً.',start:'<h1>مرحباً</h1>\n',checks:[['عنوان h1 فيه نص',d=>d.querySelector('h1')?.textContent.trim()],['عنوان h2 فيه نص',d=>d.querySelector('h2')?.textContent.trim()],['فقرة p فيها نص',d=>d.querySelector('p')?.textContent.trim()]]},
{id:'h2',k:'html',ic:'bold',t:'تنسيق النص',body:[
'داخل الفقرة تحتاج غالباً إلى إبراز كلمة أو عبارة. لذلك في HTML وسوم تعبّر عن **المعنى** لا عن الشكل فقط:',
'`<strong>` لنص مهم جداً، ويظهر عادةً بخط عريض. و`<em>` لنص فيه تأكيد، ويظهر مائلاً.',{c:'<p>الامتحان <strong>غداً</strong>، ولا <em>تنسَ</em> كتابك.</p>'},
'`<br>` ينزل بسطر جديد داخل الفقرة، و`<hr>` يرسم خطاً فاصلاً بين الأقسام. الوسمان بلا محتوى، لذلك لا يحتاجان وسم إغلاق:',{c:'<p>السطر الأول<br>السطر الثاني</p>\n<hr>'},
{tip:'وسم `<b>` و`<i>` يغيّران الشكل فقط. فضّل `<strong>` و`<em>` لأنهما يوصلان المعنى لقارئ الشاشة.'}],
task:'اكتب فقرة `<p>` فيها كلمة داخل `<strong>` وأخرى داخل `<em>`.',start:'<p>تعلّم HTML  وCSS كل يوم.</p>',checks:[['فقرة p موجودة',d=>d.querySelector('p')],['وسم strong داخل الفقرة',d=>d.querySelector('p strong')?.textContent.trim()],['وسم em داخل الفقرة',d=>d.querySelector('p em')?.textContent.trim()]]},
{id:'h3',k:'html',ic:'link',t:'الروابط',body:[
'الرابط هو ما يجعل الويب "شبكة". يُكتب بالوسم `<a>`، والخاصية `href` تحدد الوجهة، والنص بين الوسمين هو ما يضغط عليه المستخدم:',{c:'<a href="https://example.com">زر الموقع</a>'},
'الخاصية هي معلومة إضافية تُكتب داخل وسم الفتح بصيغة `اسم="قيمة"`. مثلاً `target="_blank"` تفتح الرابط في تبويب جديد.',{c:'<a href="https://example.com" target="_blank">تبويب جديد</a>'},
'يمكن أيضاً أن يفتح الرابط تطبيق البريد أو الاتصال:',{c:'<a href="mailto:me@mail.com">راسلنا</a>\n<a href="tel:+249123456789">اتصل بنا</a>'},
{tip:'اكتب نص رابط يفهمه القارئ وحده، مثل "حمّل الدليل" وليس "اضغط هنا".'}],
task:'أنشئ رابطاً `href` يبدأ بـ `https` ويفتح في تبويب جديد، وله نص واضح.',start:'<a>زر موقعنا</a>\n',checks:[['رابط a له href يبدأ بـ http',d=>d.querySelector('a[href^="http"]')],['يفتح في تبويب جديد target',d=>d.querySelector('a[target=_blank]')],['نص الرابط غير فارغ',d=>d.querySelector('a')?.textContent.trim()]]},
{id:'h4',k:'html',ic:'image',t:'الصور',body:[
'الصورة تُكتب بالوسم `<img>` وهو بلا وسم إغلاق. الخاصية `src` تحدد مصدر الصورة، و`alt` نص بديل يظهر إذا فشل التحميل ويقرؤه قارئ الشاشة:',{c:'<img src="https://picsum.photos/200" alt="منظر طبيعي" width="200">'},
'لإضافة عنوان تحت الصورة استخدم `<figure>` مع `<figcaption>`:',{c:'<figure>\n  <img src="nile.jpg" alt="نهر النيل">\n  <figcaption>نهر النيل عند الغروب</figcaption>\n</figure>'},
{tip:'لا تترك `alt` فارغاً في صورة تحمل معنى. اكتب وصفاً قصيراً لما تراه. وإذا كانت الصورة للزينة فقط اجعله `alt=""`.'}],
task:'ابنِ `<figure>` فيه صورة لها `src` و`alt`، وتحتها `<figcaption>` بنص.',start:'<figure>\n  \n</figure>',checks:[['وسم figure',d=>d.querySelector('figure')],['صورة لها src وalt',d=>d.querySelector('figure img[src][alt]')?.alt.trim()],['وسم figcaption فيه نص',d=>d.querySelector('figcaption')?.textContent.trim()]]},
{id:'h5',k:'html',ic:'list',t:'القوائم',body:[
'هناك نوعان: القائمة النقطية `<ul>` (لا يهم ترتيبها) والمرقمة `<ol>` (الترتيب مهم، كخطوات وصفة). كل عنصر يكون داخل `<li>`:',{c:'<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n</ul>\n\n<ol>\n  <li>افتح المحرر</li>\n  <li>اكتب الكود</li>\n</ol>'},
'يمكن تداخل القوائم بوضع قائمة كاملة داخل `<li>`:',{c:'<ul>\n  <li>الواجهة\n    <ul>\n      <li>HTML</li>\n    </ul>\n  </li>\n</ul>'},
{tip:'القوائم ليست للنص فقط: قوائم التنقل في المواقع (القائمة الرئيسية) تُبنى غالباً بـ `<ul>` ثم تُنسّق بـ CSS.'}],
task:'أنشئ قائمة `<ul>` فيها 3 عناصر على الأقل، وقائمة `<ol>` فيها عنصران.',start:'<h2>لغات الويب</h2>\n<ul>\n  <li>HTML</li>\n</ul>\n',checks:[['قائمة ul بثلاثة li أو أكثر',d=>d.querySelectorAll('ul>li').length>=3],['قائمة ol بعنصرين أو أكثر',d=>d.querySelectorAll('ol>li').length>=2]]},
{id:'h6',k:'html',ic:'cursor',t:'النماذج',body:[
'النموذج `<form>` هو وسيلة جمع البيانات من المستخدم (تسجيل، بحث، تعليق). داخله حقول `<input>`، ونوع كل حقل تحدده الخاصية `type`: `text` و`email` و`password` و`number`.',
'اربط كل حقل بعنوان `<label>` بالخاصية `for` المطابقة لـ `id` الحقل. عندها يضغط المستخدم على العنوان فيُفعَّل الحقل:',{c:'<form>\n  <label for="mail">البريد</label>\n  <input id="mail" type="email"\n    placeholder="you@mail.com" required>\n  <button>اشترك</button>\n</form>'},
'`placeholder` نص إرشادي يختفي عند الكتابة، و`required` يمنع الإرسال إذا ترك الحقل فارغاً. وللنص الطويل استخدم `<textarea>`.',
{tip:'نوع `email` يجعل لوحة مفاتيح الهاتف تعرض حرف @ تلقائياً، ويتحقق المتصفح من الصيغة. اختيار النوع الصحيح يحسّن التجربة بلا أي كود إضافي.'}],
task:'ابنِ نموذجاً فيه `<label>` وحقل `email` إلزامي `required` وزر.',start:'<form>\n  \n</form>',checks:[['نموذج form',d=>d.querySelector('form')],['عنوان label',d=>d.querySelector('label')?.textContent.trim()],['حقل email إلزامي',d=>d.querySelector('input[type=email][required]')],['زر button',d=>d.querySelector('button')]]},
{id:'c1',k:'css',ic:'palette',t:'الألوان',body:[
'CSS هي لغة الشكل. تُكتب داخل وسم `<style>` على هيئة قواعد: **محدد** يختار العناصر، ثم أقواس فيها خصائص:',{c:'<style>\n  h1 {\n    color: teal;\n  }\n</style>'},
'`color` للون النص و`background` للون الخلفية. القيمة تُكتب بأكثر من طريقة:',{c:'color: red;            /* اسم */\ncolor: #0E7C86;        /* hex */\ncolor: rgb(14,124,134);\ncolor: hsl(185,80%,29%);'},
{tip:'كل خاصية تنتهي بفاصلة منقوطة `;`. نسيانها هو الخطأ الأشهر عند المبتدئين، ويجعل السطر التالي لا يعمل.'}],
task:'لوّن `h1` بأي لون غير الأسود، وأعطِ `body` لون خلفية.',start:'<style>\n  body {\n    \n  }\n  h1 {\n    \n  }\n</style>\n<h1>ويب نايل</h1>',checks:[['لون h1 ليس الأسود',d=>gcs(d,'h1').color!=='rgb(0, 0, 0)'],['خلفية body ليست شفافة',d=>gcs(d,'body').backgroundColor!=='rgba(0, 0, 0, 0)']]},
{id:'c2',k:'css',ic:'type',t:'الخطوط والنص',body:[
'خصائص النص الأساسية: `font-size` للحجم، `font-weight` للسماكة، `font-family` لنوع الخط، `text-align` للمحاذاة، و`line-height` لارتفاع السطر.',{c:'p {\n  font-family: Cairo, sans-serif;\n  font-size: 18px;\n  line-height: 1.8;\n}\nh1 {\n  font-weight: 900;\n  text-align: center;\n}'},
'اكتب `line-height` كرقم بلا وحدة، فيُحسب نسبةً لحجم الخط. القيمة بين 1.5 و1.8 مريحة للقراءة، خصوصاً في العربية.',
{tip:'اذكر خطاً بديلاً دائماً في `font-family` (مثل `sans-serif`)، فيستخدمه الجهاز إن لم يجد الخط الأول.'}],
task:'اجعل حجم `h1` أكبر من `30px` وموسّطاً، وارتفاع سطر `p` لا يقل عن `1.5`.',start:'<style>\n  h1 {\n    \n  }\n  p {\n    \n  }\n</style>\n<h1>عنوان كبير</h1>\n<p>فقرة تجريبية لاختبار ارتفاع السطر.</p>',checks:[['حجم h1 أكبر من 30px',d=>px(gcs(d,'h1').fontSize)>30],['محاذاة h1 center',d=>gcs(d,'h1').textAlign==='center'],['ارتفاع سطر p ≥ 1.5',d=>px(gcs(d,'p').lineHeight)/px(gcs(d,'p').fontSize)>=1.49]]},
{id:'c3',k:'css',ic:'box',t:'الصندوق Box Model',body:[
'كل عنصر في الصفحة صندوق مكوّن من أربع طبقات من الداخل للخارج: المحتوى، ثم `padding` (حشوة داخلية)، ثم `border` (الحد)، ثم `margin` (مسافة خارجية تفصله عن غيره).',{c:'.card {\n  padding: 16px;   /* داخل الحد */\n  margin: 12px;    /* خارج الحد */\n}'},
'يمكن تحديد كل جهة على حدة: `padding-top` و`margin-bottom`، أو كتابة أربع قيم بالترتيب (أعلى، يمين، أسفل، يسار): `padding: 8px 16px 8px 16px;`.',
{tip:'أضف `box-sizing: border-box` للعناصر، فيُحسب عرضها شاملاً الحشوة والحد، ويسهل التحكم بالمقاسات.'}],
task:'أعطِ `.card` حشوة `padding` لا تقل عن `16px` ومسافة `margin` لا تقل عن `8px`.',start:'<style>\n  .card {\n    background: #dff5f2;\n    \n  }\n</style>\n<div class="card">بطاقة</div>',checks:[['padding ≥ 16px',d=>px(gcs(d,'.card').paddingTop)>=16],['margin ≥ 8px',d=>px(gcs(d,'.card').marginTop)>=8]]},
{id:'c4',k:'css',ic:'layers',t:'الحدود والظلال',body:[
'`border` تكتبه بثلاث قيم: السماكة والنمط واللون. و`border-radius` يدوّر الزوايا، وقيمة كبيرة تجعل الشكل دائرياً:',{c:'.box {\n  border: 2px solid #0E7C86;\n  border-radius: 16px;\n}'},
'`box-shadow` يضيف ظلاً بخمس قيم: إزاحة أفقية، إزاحة عمودية، تمويه، ثم اللون. الظل الخفيف يمنح العنصر عمقاً:',{c:'.box {\n  box-shadow: 0 8px 20px rgba(0,0,0,.15);\n}'},
{tip:'الظلال الناعمة (تمويه كبير وشفافية منخفضة) تبدو أرقى من الظلال القوية الحادة.'}],
task:'اجعل `.box` بحد سماكته `2px` على الأقل، وزواياه مدورة `12px` أو أكثر، وأضف له `box-shadow`.',start:'<style>\n  .box {\n    padding: 20px;\n    \n  }\n</style>\n<div class="box">صندوق</div>',checks:[['حد سماكته ≥ 2px',d=>px(gcs(d,'.box').borderTopWidth)>=2],['زوايا مدورة ≥ 12px',d=>px(gcs(d,'.box').borderTopLeftRadius)>=12],['ظل box-shadow',d=>gcs(d,'.box').boxShadow!=='none']]},
{id:'c5',k:'css',ic:'columns',t:'التخطيط بـ Flexbox',body:[
'Flexbox يرتّب العناصر في صف أو عمود بسهولة. اجعل الأب `display: flex` فيصطف أبناؤه بجانب بعض تلقائياً:',{c:'.row {\n  display: flex;\n  gap: 12px;\n  justify-content: space-between;\n  align-items: center;\n}'},
'`gap` مسافة بين الأبناء. `justify-content` يوزعهم على المحور الرئيسي (أفقي افتراضياً) مثل `center` و`space-between`. `align-items` يحاذيهم على المحور الآخر.',
'لجعلها عموداً استخدم `flex-direction: column`، وللسماح بالنزول لسطر جديد عند ضيق المساحة استخدم `flex-wrap: wrap`.',
{tip:'أغلب أشرطة التنقل والبطاقات في التطبيقات تُبنى بـ Flexbox. أتقنه أولاً قبل Grid.'}],
task:'اجعل `.row` بنظام `flex` مع `gap` وتوزيع `space-between` ومحاذاة `center`.',start:'<style>\n  .row {\n    \n  }\n  .row div {background:#cfeeea;padding:12px;border-radius:10px}\n</style>\n<div class="row">\n  <div>١</div><div>٢</div><div>٣</div>\n</div>',checks:[['display: flex',d=>gcs(d,'.row').display==='flex'],['gap أكبر من صفر',d=>px(gcs(d,'.row').columnGap)>0],['justify-content: space-between',d=>gcs(d,'.row').justifyContent==='space-between'],['align-items: center',d=>gcs(d,'.row').alignItems==='center']]},
{id:'c6',k:'css',ic:'grid',t:'الشبكة Grid',body:[
'Grid يرتب العناصر في صفوف وأعمدة معاً، وهو الأنسب للمعارض والألواح. `display: grid` ثم تحدد الأعمدة بـ `grid-template-columns`:',{c:'.gallery {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 10px;\n}'},
'الوحدة `fr` تعني "جزءاً من المساحة المتاحة". ثلاثة `1fr` تعطي ثلاثة أعمدة متساوية. ويمكن اختصارها: `repeat(3, 1fr)`.',
{tip:'Flexbox لصف أو عمود واحد، وGrid للتخطيط ثنائي الأبعاد. ولا مانع من الجمع بينهما في الصفحة نفسها.'}],
task:'اجعل `.gallery` شبكة `grid` من عمودين على الأقل بـ `grid-template-columns` مع `gap`.',start:'<style>\n  .gallery {\n    \n  }\n  .gallery div {background:#cfeeea;padding:24px;border-radius:10px;text-align:center}\n</style>\n<div class="gallery">\n  <div>1</div><div>2</div><div>3</div><div>4</div>\n</div>',checks:[['display: grid',d=>gcs(d,'.gallery').display==='grid'],['عمودان أو أكثر',d=>gcs(d,'.gallery').gridTemplateColumns.split(' ').length>=2],['gap أكبر من صفر',d=>px(gcs(d,'.gallery').columnGap)>0]]},
{id:'c7',k:'css',ic:'phone',t:'التصميم المتجاوب',body:[
'الصفحة تُعرض على هاتف صغير وعلى شاشة كبيرة. **الاستعلامات الإعلامية** `@media` تطبّق قواعد فقط عندما يتحقق شرط، مثل عرض الشاشة:',{c:'.cards {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n}\n\n@media (max-width: 600px) {\n  .cards {\n    grid-template-columns: 1fr;\n  }\n}'},
'المعنى: ثلاثة أعمدة في الشاشات الكبيرة، وعمود واحد حين يقل العرض عن `600px`.',
'ولا تنسَ وسم `viewport` في `<head>` لأي صفحة موجهة للهاتف:',{c:'<meta name="viewport"\n  content="width=device-width, initial-scale=1">'},
{tip:'صمّم للهاتف أولاً (Mobile First) ثم وسّع للشاشات الكبيرة بـ `min-width`. هذا الأسلوب أبسط وأسرع.'}],
task:'أضف استعلاماً `@media` بشرط `max-width` أو `min-width` وضع بداخله قاعدة واحدة على الأقل.',start:'<style>\n  .cards {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    gap: 8px;\n  }\n  .cards div {background:#cfeeea;padding:20px;text-align:center}\n\n  /* اكتب الاستعلام هنا */\n</style>\n<div class="cards">\n  <div>1</div><div>2</div><div>3</div>\n</div>',checks:[['يوجد @media بشرط عرض',d=>[...d.styleSheets].some(s=>[...s.cssRules].some(r=>r.type===4&&/(max|min)-width/.test(r.conditionText||r.media.mediaText)))],['بداخله قاعدة CSS',d=>[...d.styleSheets].some(s=>[...s.cssRules].some(r=>r.type===4&&r.cssRules.length>0))]]}
];

/* ---------- More lessons ---------- */
const rule=(d,sel,p)=>{for(const s of d.styleSheets)for(const r of s.cssRules)if(r.selectorText===sel){const v=r.style.getPropertyValue(p);if(v)return v}return''};
const anyRule=(d,f)=>[...d.styleSheets].some(s=>[...s.cssRules].some(f));
LESSONS.push(
{id:'h0',k:'html',ic:'code',t:'هيكل صفحة الويب',body:[
'صفحة الويب ملف نصي ينتهي بـ `.html`، يقرؤه المتصفح ويرسم الصفحة. وكل صفحة سليمة تبدأ بهيكل ثابت تتعلمه مرة واحدة وتستعمله دائماً:',
{c:'<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>عنوان الصفحة</title>\n</head>\n<body>\n  <h1>مرحباً</h1>\n</body>\n</html>'},
'`<!DOCTYPE html>` تخبر المتصفح أن الصفحة بمعيار HTML5. و`<html>` هو الجذر الذي يحوي كل شيء، وفيه `lang` للغة الصفحة و`dir="rtl"` لاتجاه الكتابة من اليمين لليسار.',
'`<head>` فيه معلومات عن الصفحة **لا تظهر** للزائر: الترميز `charset` لعرض العربية سليمة، و`viewport` ليتلاءم العرض مع الهاتف، و`<title>` وهو الاسم الذي يظهر في التبويب.',
'أما `<body>` ففيه كل ما **يظهر** فعلاً: العناوين والفقرات والصور وغيرها.',
{tip:'من دون `charset="UTF-8"` قد تظهر الحروف العربية رموزاً غريبة. ومن دون `viewport` تظهر الصفحة على الهاتف مصغّرة جداً.'}],
task:'أكمل الهيكل: `lang` واتجاه `rtl` في `<html>`، و`title`، و`charset`، و`viewport` في `<head>`، وعنوان `<h1>` في `<body>`.',
start:'<!DOCTYPE html>\n<html>\n<head>\n  \n</head>\n<body>\n  \n</body>\n</html>',
checks:[['اللغة lang محددة',d=>d.documentElement.lang.trim()],['اتجاه rtl',d=>d.documentElement.dir==='rtl'],['عنوان title فيه نص',d=>d.title.trim()],['ترميز charset',d=>d.querySelector('meta[charset]')],['وسم viewport',d=>d.querySelector('meta[name=viewport]')],['عنوان h1 داخل body',d=>d.body.querySelector('h1')?.textContent.trim()]]},
{id:'hT',k:'html',ic:'table',t:'الجداول',body:[
'الجدول لعرض بيانات لها صفوف وأعمدة، مثل جدول درجات أو أسعار. الوسم `<table>` يحيط بالجدول، و`<tr>` صف، و`<th>` خلية عنوان، و`<td>` خلية بيانات:',
{c:'<table>\n  <tr>\n    <th>المادة</th>\n    <th>الدرجة</th>\n  </tr>\n  <tr>\n    <td>الرياضيات</td>\n    <td>90</td>\n  </tr>\n</table>'},
'للتنظيم أضف `<thead>` للعناوين و`<tbody>` للبيانات. ولدمج خليتين أفقياً استعمل `colspan`، وعمودياً `rowspan`:',
{c:'<td colspan="2">خلية عريضة</td>'},
{tip:'الجدول للبيانات فقط. لا تستعمله لترتيب شكل الصفحة، فذلك عمل Flexbox وGrid.'}],
task:'ابنِ جدولاً فيه صف عناوين بخليتين `<th>` على الأقل، وصفّان للبيانات بخلايا `<td>`.',
start:'<table>\n  <tr>\n    <th>الاسم</th>\n  </tr>\n</table>',
checks:[['جدول table',d=>d.querySelector('table')],['خليتا عنوان th أو أكثر',d=>d.querySelectorAll('th').length>=2],['ثلاثة صفوف tr أو أكثر',d=>d.querySelectorAll('tr').length>=3],['أربع خلايا td أو أكثر',d=>d.querySelectorAll('td').length>=4]]},
{id:'hS',k:'html',ic:'layout',t:'الوسوم الدلالية',body:[
'الوسوم الدلالية تصف **دور** الجزء في الصفحة، فيفهم المتصفح ومحركات البحث وقارئات الشاشة بنية صفحتك، بدل أن تكون كلها `<div>`:',
'`<header>` رأس الصفحة. `<nav>` روابط التنقل. `<main>` المحتوى الأساسي (مرة واحدة فقط). `<section>` قسم موضوعي. `<article>` محتوى مستقل كمقال. `<aside>` محتوى جانبي. `<footer>` تذييل الصفحة.',
{c:'<header>\n  <h1>مدونتي</h1>\n  <nav>\n    <a href="#">الرئيسية</a>\n    <a href="#">من أنا</a>\n  </nav>\n</header>\n<main>\n  <section>\n    <h2>آخر المقالات</h2>\n  </section>\n</main>\n<footer>جميع الحقوق محفوظة</footer>'},
{tip:'قبل أن تكتب div اسأل: هل يوجد وسم يصف هذا الجزء؟ استعمله. وإن لم يوجد فاستعمل div.'}],
task:'ابنِ صفحة: `header` فيه `h1`، و`nav` فيها رابطان، و`main` فيه `section`، و`footer` فيه نص.',
start:'<header>\n  \n</header>\n<main>\n  \n</main>\n<footer></footer>',
checks:[['header فيه h1',d=>d.querySelector('header h1')?.textContent.trim()],['nav فيها رابطان',d=>d.querySelectorAll('nav a').length>=2],['main فيه section',d=>d.querySelector('main section')],['footer فيه نص',d=>d.querySelector('footer')?.textContent.trim()]]},
{id:'hD',k:'html',ic:'tag',t:'div وspan وclass وid',body:[
'`<div>` صندوق عام يأخذ سطراً كاملاً (عنصر **كتلة**)، و`<span>` حاوية نصية صغيرة تبقى داخل السطر (عنصر **مضمّن**). لا معنى لهما بذاتهما، لكنهما أساس التصميم حين نمنحهما هوية:',
{c:'<div class="card">\n  <h2 id="title">بطاقة</h2>\n  <span class="tag big">جديد</span>\n</div>'},
'`class` اسم مجموعة يمكن تكراره على عناصر كثيرة، ويمكن للعنصر الواحد أن يحمل أكثر من class مفصولة بمسافة. أما `id` فاسم **فريد** لعنصر واحد في الصفحة.',
{tip:'اختر أسماء تصف الوظيفة لا الشكل، مثل `price` وليس `red-text`، فقد يتغير اللون لاحقاً.'}],
task:'أنشئ `div` بـ `class="card"` يحتوي `h2` له `id`، و`span` له صنفان `class`.',
start:'<div>\n  \n</div>',
checks:[['div بـ class="card"',d=>d.querySelector('div.card')],['h2 داخل البطاقة وله id',d=>d.querySelector('div.card h2[id]')],['span له صنفان',d=>d.querySelector('div.card span[class*=" "]')]]},
{id:'hF2',k:'html',ic:'sliders',t:'حقول النماذج المتقدمة',body:[
'بعد الحقول النصية توجد حقول اختيار. **القائمة المنسدلة** `<select>` فيها خيارات `<option>`. و**أزرار الاختيار** `type="radio"` تجمعها الخاصية `name` نفسها فيختار المستخدم واحداً فقط. أما **مربع الاختيار** `type="checkbox"` فللاختيار المتعدد:',
{c:'<select name="city">\n  <option>الخرطوم</option>\n  <option>أم درمان</option>\n</select>\n\n<label><input type="radio" name="lvl"> مبتدئ</label>\n<label><input type="radio" name="lvl"> متقدم</label>\n\n<label><input type="checkbox"> أوافق</label>\n\n<textarea rows="3" placeholder="رسالتك"></textarea>'},
'`<textarea>` لنص طويل متعدد الأسطر، وعدد أسطره بالخاصية `rows`.',
{tip:'زر `<button>` داخل النموذج يرسله افتراضياً. اكتب `type="button"` لزر لا يرسل شيئاً.'}],
task:'ابنِ نموذجاً فيه `select` بثلاثة خيارات، وزرّي `radio` بنفس `name`، و`checkbox`، و`textarea`.',
start:'<form>\n  \n</form>',
checks:[['select بثلاثة خيارات',d=>d.querySelectorAll('select option').length>=3],['زرّا radio بنفس name',d=>{const r=[...d.querySelectorAll('input[type=radio]')];return r.length>=2&&r[0].name&&r.every(x=>x.name===r[0].name)}],['مربع checkbox',d=>d.querySelector('input[type=checkbox]')],['حقل textarea',d=>d.querySelector('textarea')]]},
{id:'cS',k:'css',ic:'pointer',t:'المحددات Selectors',body:[
'المحدد يقول لـ CSS **أي العناصر** تريد تنسيقها. أهم أنواعه:',
{c:'p { color: gray; }         /* كل الفقرات */\n.note { color: teal; }     /* class="note" */\n#title { color: red; }     /* id="title" */\nh2, h3 { margin: 0; }      /* مجموعة */\n.note span { color: red; } /* span داخل .note */\na:hover { color: gold; }   /* عند اللمس */'},
'**عند التعارض:** إذا انطبقت قاعدتان على العنصر تفوز الأكثر تحديداً: `id` أقوى من `class`، وهو أقوى من اسم الوسم. وعند التساوي تفوز القاعدة الأخيرة في الملف.',
{tip:'اعتمد على class في معظم تنسيقاتك. استعمال id في CSS يصعّب تعديل القواعد لاحقاً.'}],
task:'أعطِ `.note` خلفية، ولوّن `#main-title`، واكتب قاعدة لـ `.note span`، وقاعدة مجموعة `h2, h3`.',
start:'<style>\n  \n</style>\n<h2 id="main-title">عنوان</h2>\n<h3>عنوان فرعي</h3>\n<p class="note">ملاحظة <span>مهمة</span></p>',
checks:[['خلفية لـ .note',d=>gcs(d,'.note').backgroundColor!=='rgba(0, 0, 0, 0)'],['لون #main-title غير الأسود',d=>gcs(d,'#main-title').color!=='rgb(0, 0, 0)'],['قاعدة لـ .note span',d=>rule(d,'.note span','color')],['محدد مجموعة h2, h3',d=>anyRule(d,r=>/^(h2, h3|h3, h2)$/.test(r.selectorText||''))]]},
{id:'cU',k:'css',ic:'ruler',t:'الوحدات والأحجام',body:[
'وحدات CSS نوعان. **ثابتة:** `px` بكسل. **نسبية:** `%` نسبة من عنصر الأب، و`rem` نسبة من حجم خط الصفحة الأساسي (عادة 16px)، و`em` نسبة من حجم خط العنصر، و`vw` و`vh` نسبة من عرض الشاشة وارتفاعها.',
{c:'.box {\n  width: 90%;\n  max-width: 480px;\n  font-size: 1.125rem;\n  min-height: 50vh;\n}'},
'المعنى: عرض مرن بنسبة 90% لكنه لا يتجاوز 480px، فيبدو جيداً على الهاتف والشاشات الكبيرة معاً.',
{tip:'استعمل rem لأحجام الخطوط ليحترم تصميمك إعدادات حجم الخط عند المستخدم.'}],
task:'اجعل `.box` بعرض `width` بالنسبة `%`، و`max-width` بالبكسل `px`، وحجم خط `font-size` بوحدة `rem`.',
start:'<style>\n  .box {\n    background: #dff5f2;\n    padding: 16px;\n    \n  }\n</style>\n<div class="box">صندوق مرن</div>',
checks:[['العرض بالنسبة %',d=>/%$/.test(rule(d,'.box','width'))],['max-width بالبكسل',d=>/px$/.test(rule(d,'.box','max-width'))],['حجم الخط بـ rem',d=>/rem$/.test(rule(d,'.box','font-size'))]]},
{id:'cB',k:'css',ic:'image',t:'الخلفيات والتدرجات',body:[
'`background-color` لون مصمت، و`background-image` لصورة أو **تدرج لوني**:',
{c:'.hero {\n  background: linear-gradient(to left, #0E7C86, #12B5A6);\n  color: white;\n  min-height: 200px;\n}'},
'اتجاه التدرج بعد `to` (مثل `to left`) ثم ألوانه بالترتيب. وللصور: `background-image: url("nile.jpg")` مع `background-size: cover` لتملأ المساحة، و`background-position: center` لتوسيطها، و`background-repeat: no-repeat` لمنع التكرار.',
{tip:'عند وضع نص فوق صورة أو تدرج اختر لوناً يقرأ بوضوح فوقه (تباين عالٍ)، وإلا صعبت القراءة.'}],
task:'اجعل خلفية `.hero` تدرجاً `linear-gradient`، وارتفاعها الأدنى `min-height` لا يقل عن `150px`، ولون النص أبيض، وحشوة `16px` أو أكثر.',
start:'<style>\n  .hero {\n    \n  }\n</style>\n<div class="hero">مرحباً بك</div>',
checks:[['خلفية linear-gradient',d=>(rule(d,'.hero','background')+rule(d,'.hero','background-image')).includes('gradient')],['min-height ≥ 150px',d=>px(gcs(d,'.hero').minHeight)>=150],['لون النص أبيض',d=>gcs(d,'.hero').color==='rgb(255, 255, 255)'],['حشوة ≥ 16px',d=>px(gcs(d,'.hero').paddingTop)>=16]]},
{id:'cD',k:'css',ic:'move',t:'العرض والتموضع',body:[
'`display` يحدد سلوك العنصر: `block` يأخذ سطراً كاملاً، و`inline` يبقى داخل السطر ولا يقبل عرضاً وارتفاعاً، و`inline-block` يجمع الاثنين، و`none` يخفيه تماماً.',
'أما `position` فتتحكم بمكان العنصر: `static` (الافتراضي)، و`relative` يبقى مكانه ويصبح مرجعاً لأبنائه، و`absolute` يخرج من التدفق ويتموضع بالنسبة لأقرب أب موضَّع، و`fixed` يثبت على الشاشة، و`sticky` يلتصق عند التمرير.',
{c:'.card {\n  position: relative;\n}\n.badge {\n  position: absolute;\n  top: 8px;\n  left: 8px;\n  z-index: 2;\n}'},
'`z-index` يرتب الطبقات: الرقم الأكبر يظهر فوق.',
{tip:'قاعدة ذهبية: لتثبيت عنصر داخل بطاقة اجعل البطاقة relative والعنصر absolute.'}],
task:'اجعل `.card` بـ `relative`، و`.badge` بـ `absolute` مع `top` و`z-index` لا يقل عن 1.',
start:'<style>\n  .card {\n    background: #dff5f2;\n    padding: 40px 16px;\n    \n  }\n  .badge {\n    background: #F5B83D;\n    padding: 2px 10px;\n    border-radius: 99px;\n    \n  }\n</style>\n<div class="card">\n  <span class="badge">جديد</span>\n  بطاقة المنتج\n</div>',
checks:[['.card موضع relative',d=>gcs(d,'.card').position==='relative'],['.badge موضع absolute',d=>gcs(d,'.badge').position==='absolute'],['.badge له top',d=>gcs(d,'.badge').top!=='auto'],['z-index ≥ 1',d=>parseInt(gcs(d,'.badge').zIndex)>=1]]},
{id:'cV',k:'css',ic:'braces',t:'متغيرات CSS',body:[
'المتغير يخزّن قيمة تستعملها في أماكن كثيرة، فتغيّرها مرة واحدة فتتغير في كل مكان. يُعرَّف باسم يبدأ بـ `--` داخل `:root` (جذر الصفحة)، ويُستدعى بـ `var()`:',
{c:':root {\n  --main: #0E7C86;\n  --radius: 12px;\n}\n.btn {\n  background: var(--main);\n  border-radius: var(--radius);\n}'},
'يمكنك وضع قيمة احتياطية: `var(--main, teal)` تُستعمل إذا لم يوجد المتغير.',

{id:'cT',k:'css',ic:'sparkles',t:'الانتقالات والتأثيرات',body:[

{c:'.btn {\n  background: #0E7C86;\n  transition: all .3s ease;\n}\n.btn:hover {\n  background: #12B5A6;\n  transform: translateY(-2px);\n}'},

{id:'cA',k:'css',ic:'play',t:'الحركة Animations',body:[

{id:'j0',k:'js',ic:'terminal',t:'أول برنامج',body:[
'JavaScript هي لغة **البرمجة** التي تعمل داخل المتصفح. إن كانت HTML هيكل الصفحة وCSS شكلها، فـ JavaScript هي التي تجعلها **تتحرك وتتفاعل**: تحسب، وتقرر، وتستجيب لضغطات المستخدم.',
'أول أمر يتعلمه كل مبرمج هو الطباعة. `console.log()` تكتب ما بين القوسين في لوحة المخرجات، وهي أداتك الأولى لاختبار أي شيء:',
{c:'console.log("مرحباً بالعالم");\nconsole.log(2 + 3);'},
'النص يُكتب بين علامتي اقتباس، أما الأرقام فبدونها. وكل أمر ينتهي بفاصلة منقوطة `;`. والسطر الذي يبدأ بـ `//` تعليق يتجاهله الحاسوب، لتكتب فيه ملاحظاتك:',
{c:'// هذا تعليق\nconsole.log("جافاسكربت");'},
{tip:'JavaScript حساسة لحالة الأحرف: `console` تعمل أما `Console` فلا. وإذا ظهر خطأ في النتيجة فاقرأ رسالته، فهي تدلك على موضع المشكلة.'}],

{id:'j1',k:'js',ic:'braces',t:'المتغيرات',body:[
'المتغير **صندوق له اسم** تحفظ فيه قيمة لتستعملها لاحقاً. نُنشئه بالكلمة `let` للقيمة التي قد تتغير، و`const` للقيمة الثابتة:',
{c:'const name = "سارة";\nlet age = 20;\nage = 21; // التغيير مسموح مع let\nconsole.log(name, age);'},
'لا يمكن تغيير `const` بعد إنشائها وإلا ظهر خطأ. اجعل `const` هي الأصل، واستعمل `let` فقط حين تحتاج للتغيير.',
'أسماء المتغيرات تبدأ بحرف ولا فراغات فيها، وتُكتب بنمط **camelCase** مثل `userName`. ولدمج المتغيرات داخل نص استعمل **القالب النصي**: علامة الاقتباس المائلة (backtick) مع الصيغة `${}`:',

task:'أنشئ `const` باسمك و`let` لعمرك، ثم غيّر العمر، واطبع جملة بالقالب النصي `${}` تحوي المتغيرين.',

{id:'j2',k:'js',ic:'type',t:'أنواع البيانات',body:[
'لكل قيمة **نوع**، والنوع يحدد ما يمكنك فعله بها. أهم الأنواع: `string` نص مثل "مرحباً"، و`number` رقم مثل 42 و3.14، و`boolean` منطقي وهو `true` أو `false`، و`undefined` قيمة لم تُحدد، و`null` فراغ مقصود.',
{c:'console.log(typeof "نص");   // string\nconsole.log(typeof 42);     // number\nconsole.log(typeof true);   // boolean'},

{id:'j3',k:'js',ic:'hash',t:'العمليات والمقارنات',body:[
'العمليات الحسابية: `+` جمع، `-` طرح، `*` ضرب، `/` قسمة، `%` باقي القسمة، `**` أُسّ. وللمقارنة: `===` يساوي، `!==` لا يساوي، و`>` و`<` و`>=` و`<=`. ونتيجة المقارنة دائماً `true` أو `false`:',
{c:'console.log(10 % 3);     // 1\nconsole.log(2 ** 3);     // 8\nconsole.log(5 > 3);      // true\nconsole.log(5 === "5");  // false'},
'استعمل `===` دائماً للمقارنة (لا `==`) لأنها تقارن النوع والقيمة معاً. وللمنطق: `&&` (و) تتطلب تحقق الطرفين، و`||` (أو) يكفي أحدهما، و`!` (ليس) تعكس القيمة:',
{c:'console.log(true && false);  // false\nconsole.log(true || false);  // true\nconsole.log(!true);          // false'},
{tip:'`%` مفيدة جداً: إذا كان `n % 2 === 0` فالعدد زوجي.'}],
task:'احسب مساحة مستطيل (8 × 5) واطبعها، ثم اطبع باقي قسمة 17 على 5، ثم اطبع نتيجة `10 > 5 && 3 < 1`.',
start:'const width = 8;\nconst height = 5;\n\n',

{id:'j4',k:'js',ic:'split',t:'الشروط',body:[
'الشرط يجعل البرنامج **يقرر**. `if` تنفذ الكود إذا تحقق الشرط، و`else` إذا لم يتحقق، و`else if` لشرط آخر. الشرط بين القوسين والكود بين `{ }`:',
{c:'const age = 17;\nif (age >= 18) {\n  console.log("بالغ");\n} else {\n  console.log("قاصر");\n}'},
'تُفحص الشروط من الأعلى إلى الأسفل، وتُنفَّذ أول كتلة يتحقق شرطها فقط:',
{c:'const n = 0;\nif (n > 0) {\n  console.log("موجب");\n} else if (n < 0) {\n  console.log("سالب");\n} else {\n  console.log("صفر");\n}'},
{tip:'لا تخلط بين `=` للإسناد و`===` للمقارنة. كتابة `if (x = 5)` خطأ شائع جداً.'}],

{id:'j5',k:'js',ic:'repeat',t:'الحلقات',body:[
'الحلقة تكرر الكود دون أن تنسخه. حلقة `for` لها ثلاثة أجزاء: البداية، والشرط، والزيادة:',
{c:'for (let i = 1; i <= 3; i++) {\n  console.log("الرقم", i);\n}'},

{c:'let n = 3;\nwhile (n > 0) {\n  console.log(n);\n  n--;\n}'},

{id:'j8',k:'js',ic:'box',t:'الكائنات',body:[

  return `<!doctype html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:system-ui,sans-serif;margin:14px;line-height:1.7}</style></head><body>${page||''}<script>
var __L=[],__E=null,__T=[],__c=0;
function __g(){if(++__c>200000)throw new Error('حلقة لا نهائية')}
function __s(v){try{if(typeof v==='string')return v;if(v===undefined||v===null||typeof v==='number'||typeof v==='boolean'||typeof v==='function')return String(v);return JSON.stringify(v)}catch(e){return String(v)}}
console.log=console.info=console.warn=function(){__L.push([].map.call(arguments,__s).join(' '))};
console.error=function(){__L.push('!'+[].map.call(arguments,__s).join(' '))};
window.onerror=function(m){__E=String(m)};
function __t(v){__T.push(v)}
<\/script><script>${g}
<\/script><script>${tests||''}
<\/script><script>
setTimeout(function(){parent.postMessage({wn:1,logs:__L,err:__E,t:__T,html:document.body.innerHTML},'*')},60);
<\/script></body></html>`}
function editor(host,code,onload,fname,o){
  o=o||{};const JS=!!o.js;
  host.innerHTML=`<div class="seg"><button class="on" data-s="c">${ic('code')} الكود</button>${JS&&!o.page?'':`<button data-s="r">${ic('eye')} ${JS?'الصفحة':'النتيجة'}</button>`}${JS?`<button data-s="o">${ic('terminal')} الكونسول</button>`:''}</div>
  <div class="ide" id="pc"><div class="tabs"><span class="dots"><i></i><i></i><i></i></span><span class="fn">${fname||'index.html'}</span></div><div class="code"><div class="gut" id="gut"></div><div class="wrap"><pre class="hl" id="hl"></pre><textarea class="ed" id="ed" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea></div></div></div>
  <div class="pv off" id="pr"><div class="tabs"><span class="dots"><i></i><i></i><i></i></span><span class="addr">preview</span></div><iframe class="frame" id="fr" sandbox="${JS?'allow-scripts':'allow-same-origin'}"></iframe></div>
  ${JS?'<div class="pv hide" id="pcn"><div class="tabs"><span class="dots"><i></i><i></i><i></i></span><span class="addr">console</span></div><pre class="con" id="con"></pre></div>':''}
  <div id="kb"><div class="sug" id="sug"></div><div class="keys" id="keys"></div></div>`;
  const ed=$('#ed'),fr=$('#fr'),h=$('#hl'),g=$('#gut'),con=$('#con');ed.value=code;
  const keys=JS?['(',')','{','}','[',']',';','"',"'",'`','=','>','.',',','!','+','-','*','/','&','|','?',':','$']:['<','>','/','"','=','{','}',';',':','#','.','(',')'];
  const ka=k=>esc(k).replace(/"/g,'&quot;');
  $('#keys').innerHTML='<button data-k="  ">Tab</button>'+keys.map(k=>`<button data-k="${ka(k)}">${esc(k)}</button>`).join('');
  const paint=()=>{h.innerHTML=(JS?hJS(ed.value):hl(ed.value))+'\n';const n=ed.value.split('\n').length;g.textContent=Array.from({length:n},(_,i)=>i+1).join('\n')};
  const sync=()=>{h.scrollTop=ed.scrollTop;h.scrollLeft=ed.scrollLeft;g.scrollTop=ed.scrollTop};
  $('#keys').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;ed.setRangeText(k,ed.selectionStart,ed.selectionEnd,'end');if(JS)pairJS(ed,{data:k});else if(k==='>')autoClose(ed);ed.focus();ed.dispatchEvent(new Event('input'))};
  ed.onkeydown=e=>{
    if(e.key==='Tab'){e.preventDefault();ed.setRangeText('  ',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'))}
    if(e.key==='Enter'){
      const a=ed.selectionStart,v=ed.value,ls=v.lastIndexOf('\n',a-1)+1,before=v.slice(ls,a),ind=(before.match(/^\s*/)||[''])[0];e.preventDefault();
      if(JS&&/[{(\[]\s*$/.test(before)){
        if(/^[})\]]/.test(v.slice(ed.selectionEnd))){ed.setRangeText('\n'+ind+'  \n'+ind,a,ed.selectionEnd,'end');const c=a+1+ind.length+2;ed.setSelectionRange(c,c)}
        else ed.setRangeText('\n'+ind+'  ',a,ed.selectionEnd,'end')}
      else ed.setRangeText('\n'+ind,a,ed.selectionEnd,'end');
      ed.dispatchEvent(new Event('input'))}
  };
  const show=(v,nr)=>{host.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x.dataset.s===v));$('#pc').classList.toggle('hide',v!=='c');$('#kb').classList.toggle('hide',v!=='c');$('#pr').classList.toggle('off',v!=='r');const cn=$('#pcn');if(cn)cn.classList.toggle('hide',v!=='o');if(v!=='c'&&!nr)run()};
  host.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.s)};
  let w;const run=()=>{fr.srcdoc=JS?runner(ed.value,o.page,o.tests):wrap(ed.value)};
  if(JS){
    con.innerHTML='<div class="mu">اضغط «تشغيل» لترى النتيجة هنا</div>';
    if(window._wn)removeEventListener('message',window._wn);
    window._wn=e=>{const d=e.data;if(e.source!==fr.contentWindow||!d||!d.wn)return;
      const L=d.logs.map(l=>l[0]==='!'?`<div class="er">${esc(l.slice(1))}</div>`:`<div>${esc(l)}</div>`);
      if(d.err)L.push(`<div class="er">خطأ: ${esc(d.err)}</div>`);
      con.innerHTML=L.join('')||'<div class="mu">لا توجد مخرجات. استعمل console.log لطباعة شيء</div>';
      o.onres&&o.onres({logs:d.logs,err:d.err,t:d.t,doc:new DOMParser().parseFromString(d.html||'','text/html')})};
    addEventListener('message',window._wn)}
  ed.addEventListener('input',e=>{if(JS)pairJS(ed,e);else if(e.data==='>')autoClose(ed);paint();sync();if(!JS){clearTimeout(w);w=setTimeout(run,350)}suggest()});
  ed.addEventListener('scroll',sync);
  const sg=$('#sug');let cur=[];
  function suggest(){cur=(JS?acJS:ac)(ed.value.slice(0,ed.selectionStart),ed.value.slice(ed.selectionStart));sg.innerHTML=cur.length?cur.map((x,i)=>`<button data-i="${i}" data-t="${x.t}">${esc(x.l)}</button>`).join(''):'<span class="h">الاقتراحات الذكية تظهر هنا أثناء الكتابة</span>'}
  sg.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();const x=cur[b.dataset.i],p=ed.selectionStart,t=x.x.replace('|',''),k=x.x.indexOf('|'),from=p-x.f;ed.setRangeText(t,from,p+(x.g||0),'end');const c=from+(k<0?t.length:k);ed.setSelectionRange(c,c);ed.dispatchEvent(new Event('input'))});
  ed.addEventListener('click',suggest);ed.addEventListener('keyup',suggest);
  fr.onload=()=>{if(!JS&&onload)onload(fr.contentDocument)};
  paint();if(!JS)run();suggest();return{ed,fr,run,paint,show,main:o.page?'r':'o'};
}

oneCount()}/${LESSONS.length}</b></div><div class="stat z"><span>${ic('zap')} النقاط</span><b>${S.xp}</b></div><div class="stat f"><span>${ic('flame')} متتالية</span><b>${S.streak}</b></div></div><div class="bar"><i style="width:${p}%"></i></div></div>${n?`<div class="page" style="margin-top:18px"><button class="btn s" data-l="${n.id}">${ic('play')} تابع: ${n.t}</button></div>`:''}`;

function body(b,l){
  if(typeof b==='string')return `<p>${fmt(b)}</p>`;
  if(b.c)return `<pre class="ex">${(l&&l.k==='js'?hJS:hl)(b.c)}</pre>`;
  return `<div class="tip">${ic('bulb')}<div>${fmt(b.tip)}</div></div>`;
}
function lesson(){
  const l=LESSONS.find(x=>x.id===V.id),i=LESSONS.indexOf(l);
  const nxt=LESSONS[i+1];
  const curDone=S.done[l.id];
  const nxtFree=!nxt||curDone||S.unlocked[nxt.id]||S.done[nxt.id];
  const nxtBtn=!nxt
    ?`<button class="btn s" id="nb">العودة للدروس</button>`
    :nxtFree
      ?`<button class="btn s" id="nb">الدرس التالي ${ic('next')}</button>`
      :`<button class="btn" style="background:var(--sun);color:#0B1F2A" id="nb">${ic('play')} شاهد إعلاناً ← التخطي</button>`;
  return `<div class="bar2"><button class="ib" data-back aria-label="رجوع">${ic('back')}</button><h1>${l.t}<small>الدرس ${i+1} من ${LESSONS.length}</small></h1></div><div class="page"><div class="card">${l.body.map(b=>body(b,l)).join('')}</div><div class="card task"><h3>${ic('target')} مهمتك</h3><p>${fmt(l.task)}</p><ul class="chk" id="chk">${l.checks.map(c=>`<li>${c[0]}</li>`).join('')}</ul></div><div id="edh"></div><div class="row"><button class="btn" id="rs">${ic('reset')} إعادة</button>${l.k==='js'?`<button class="btn" id="rn">${ic('play')} تشغيل</button>`:''}<button class="btn p" id="ck">${ic('check')} تحقق</button></div><div class="row"><button class="btn" id="hint-btn" style="background:rgba(245,184,61,.15);color:var(--ink)">💡 تلميح ${ic('play')}</button></div><div class="row hide" id="nx">${nxtBtn}</div></div>`;
}
function bindLesson(){
  const l=LESSONS.find(x=>x.id===V.id),i=LESSONS.indexOf(l),JS=l.k==='js';let want=false;
  const E=editor($('#edh'),S['c_'+l.id]||l.start,JS?null:d=>{if(!want)return;want=false;evalC(d)},JS?'script.js':'index.html',JS?{js:1,page:l.page,tests:l.tests,onres:r=>{if(!want)return;want=false;r.code=E.ed.value;evalC(r)}}:null);
  E.ed.addEventListener('input',()=>{S['c_'+l.id]=E.ed.value;save()});

  if(JS)$('#rn').onclick=()=>{E.show(E.main,1);E.run()};
  $('#ck').onclick=()=>{
    if(JS){want=true;E.show(E.main,1);E.run();return}
    const d=E.fr.contentDocument;if(E.fr.srcdoc===wrap(E.ed.value)&&d&&d.readyState==='complete'&&d.body)evalC(d);else{want=true;E.run()}};

  const hintMsg=l.hint||`راجع الكود الموجود في المحاضرة وقارنه بما يطلبه التحقق — ركّز على ${l.checks[0]?l.checks[0][0]:'الشرط الأول'}.`;

  const _nxt=LESSONS[i+1];

    if(!_nxt)return go('home');

    if(S.done[l.id]||S.unlocked[_nxt.id]||S.done[_nxt.id])return go('lesson',_nxt.id);
    // تخطي بدون إنجاز — XP أو إعلان
    const _doUnlock=()=>{S.unlocked[_nxt.id]=1;save();go('lesson',_nxt.id)};
    showLockSheet('تخطي الدرس؟',`"${_nxt.t}" — أنجز الدرس للانتقال مجاناً، أو افتحه بنقاط/إعلان`,_doUnlock);
  };

  if(S.done[l.id]||(_nxt&&(S.unlocked[_nxt.id]||S.done[_nxt.id])))$('#nx').classList.remove('hide');
  function evalC(d){

    [...$('#chk').children].forEach((li,j)=>li.className=r[j]?'ok':'no');
    if(r.every(Boolean)){
      if(!S.done[l.id]){S.done[l.id]=1;S.xp+=20;const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===t?S.streak:(S.last===y?S.streak+1:1);S.last=t;save();amOnLessonDone()}
      toast('أحسنت! أنجزت الدرس +20 نقطة','good');$('#nx').classList.remove('hide');$('#nx').scrollIntoView({behavior:'smooth',block:'center'});const hb=$('#hint-btn');if(hb)hb.style.display='none';
      // حدّث زر التالي فوراً مع onclick جديد
      const nb=$('#nb');
      if(nb&&_nxt){
        nb.className='btn s';
        nb.innerHTML=`الدرس التالي ${ic('next')}`;
        nb.onclick=()=>go('lesson',_nxt.id);
      }
    }else toast('قريب! راجع البنود الحمراء','bad');
  }
}
const SNIP={'هيكل':['code','<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>صفحتي</title>\n</head>\n<body>\n  \n</body>\n</html>\n'],'عنوان':['heading','<h1>عنوان</h1>\n'],'فقرة':['type','<p>نص الفقرة</p>\n'],'زر':['cursor','<button>اضغط</button>\n'],'بطاقة':['box','<style>\n  .card {\n    padding: 16px;\n    border-radius: 16px;\n    background: #e8f7f5;\n  }\n</style>\n<div class="card">بطاقة</div>\n']};
function play(){return `<div class="bar2"><h1>تجربة حرة<small>اكتب أي HTML أو CSS وشاهد النتيجة</small></h1></div><div class="page"><div class="chips">${Object.keys(SNIP).map(k=>`<button data-sn="${k}">${ic('plus')} ${k}</button>`).join('')}</div><div id="edh"></div></div>`}
function bindPlay(){
  let saved='';try{saved=localStorage.getItem('webnile_play')||''}catch(e){}
  const E=editor($('#edh'),saved||'<h1>أهلاً بك</h1>\n<p>جرّب أي كود HTML أو CSS هنا.</p>');
  E.ed.addEventListener('input',()=>{try{localStorage.setItem('webnile_play',E.ed.value)}catch(e){}});
  document.querySelector('.chips').onclick=e=>{const b=e.target.closest('[data-sn]');if(!b)return;E.ed.value=b.dataset.sn==='هيكل'?SNIP['هيكل'][1]:E.ed.value+(E.ed.value.endsWith('\n')?'':'\n')+SNIP[b.dataset.sn][1];E.ed.dispatchEvent(new Event('input'));toast('أُضيف '+b.dataset.sn)};
}
let armed=false;
function me(){
  const bar=k=>{const a=LESSONS.filter(l=>l.k===k),d=a.filter(l=>S.done[l.id]).length;return `<div class="tr"><div><span>${TRACKS[k].split(' — ')[0]}</span><span>${d}/${a.length}</span></div><div class="b"><i style="width:${d/a.length*100}%"></i></div></div>`};
  return `<div class="bar2"><h1>تقدمي</h1></div><div class="page"><div class="card"><p class="big">${S.xp} <small style="font-size:15px;color:var(--mute)">نقطة</small></p><p style="color:var(--mute)">${S.streak>0?ic('flame')+' سلسلتك '+S.streak+' يوم متتالٍ':'ابدأ درساً اليوم لتبدأ سلسلتك'}</p></div><div class="card" style="background:linear-gradient(135deg,#0B1F2A,#0E3540);color:#EAF4F3"><p style="margin:0 0 4px;font-weight:900;font-size:16px">${ic('sun')} احصل على 50 نقطة مجاناً</p><p style="margin:0 0 12px;font-size:13px;color:#9DB8C0">شاهد إعلاناً قصيراً واربح نقاط XP</p><button class="btn s" style="width:100%" id="rwd">${ic('trophy')} شاهد ← 50 نقطة</button></div><div class="card">${bar('html')}${bar('css')}${bar('js')}${bar('pro')}</div>${nextL()?`<button class="btn s" style="width:100%;margin-bottom:12px" data-l="${nextL().id}">أكمل: ${nextL().t}</button>`:`<div class="card"><p>${ic('trophy')} أنهيت كل الدروس! جرّب مشروعك في التجربة الحرة.</p></div>`}<button class="btn" style="width:100%" id="rst">مسح التقدم</button></div>`;
}
const NAV={home:['waves','الدروس'],play:['code','تجربة حرة'],me:['trophy','تقدمي']};
function render(){
  $('#app').innerHTML=V.n==='home'?home():V.n==='lesson'?lesson():V.n==='play'?play():me();
  document.querySelectorAll('#nav button').forEach(b=>{const n=NAV[b.dataset.v];b.innerHTML=ic(n[0])+n[1];b.classList.toggle('on',b.dataset.v===(V.n==='lesson'?'home':V.n))});
  if(V.n==='lesson')bindLesson();if(V.n==='play')bindPlay();
  const r=$('#rst');if(r)r.onclick=()=>{if(!armed){armed=true;r.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{armed=false;r.textContent='مسح التقدم'},3000);return}armed=false;S={done:{},unlocked:{},xp:0,streak:0,last:''};save();toast('تم مسح التقدم');render()};
  const rwd=$('#rwd');if(rwd)rwd.onclick=()=>{
    if(!_rewardLoaded){toast('الإعلان لم يُحمَّل بعد، حاول لاحقاً','warning');return}
    amShowReward(()=>{S.xp+=50;save();toast('🎉 ربحت 50 نقطة!','success');render()});
  };
}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-l]');
  if(l){
    const lid=l.dataset.l;
    const n=nextL();
    const isNext=n&&n.id===lid;
    const locked=!S.done[lid]&&!isNext&&!S.unlocked[lid];
    if(locked){
      const ls=LESSONS.find(x=>x.id===lid);
      showLockSheet('درس مقفل 🔒',`"${ls?ls.t:'هذا الدرس'}" — افتحه بنقاط أو بإعلان قصير`,()=>{S.unlocked[lid]=1;save();go('lesson',lid)});
      return;
    }
    return go('lesson',lid);
  }
  if(e.target.closest('[data-back]'))return go('home');
});
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A)A.addListener('backButton',()=>{V.n!=='home'?go('home'):A.exitApp()})}catch(e){}

// ── AdMob — استراتيجية ذكية ────────────────────────────────────────
// ⚠️ للاختبار: غيّر IS_TEST إلى true لترى إعلانات تجريبية فوراً
// بعد التأكد من عمل الإعلانات أعده إلى false قبل رفع النسخة للمتجر
const IS_TEST=false;

const AD=IS_TEST?{
  // معرّفات اختبار رسمية من Google
  banner:  'ca-app-pub-3940256099942544/6300978111',
  inter:   'ca-app-pub-3940256099942544/1033173712',
  reward:  'ca-app-pub-3940256099942544/5224354917',
}:{
  // معرّفات الإنتاج الحقيقية
  banner:  'ca-app-pub-7608701150166997/2300347316',
  inter:   'ca-app-pub-7608701150166997/1719650975',
  reward:  'ca-app-pub-7608701150166997/4734938967',
};

let _am=null,_interLoaded=false,_rewardLoaded=false;
let _lessonsAfterAd=0;
const INTER_EVERY=2;

let _bannerVisible=false; // هل البانر محمّل وظاهر فعلاً
let _bannerLoaded=false;  // هل سبق أن تحمّل الإعلان بنجاح

async function amInit(){
  try{
    if(!window.Capacitor||!Capacitor.Plugins.AdMob)return;
    _am=Capacitor.Plugins.AdMob;
    await _am.initialize({initializeForTesting:IS_TEST});

    // ── البانر: طبّق الـ padding فقط بعد تحميل الإعلان ──
    _am.addListener('bannerAdLoaded',()=>{
      _bannerLoaded=true;
      if(_bannerVisible) _applyBannerPadding();
    });
    _am.addListener('bannerAdOpened',()=>{
      // يُطلق أيضاً عند resumeBanner — يضمن تطبيق الـ padding
      if(_bannerVisible) _applyBannerPadding();
    });
    _am.addListener('bannerAdFailedToLoad',()=>{
      _bannerLoaded=false;
      _clearBannerPadding();
    });

    // ── البيني (أسماء رسمية من BannerAdPluginEvents / InterstitialAdPluginEvents) ──
    _am.addListener('interstitialAdLoaded',    ()=>{_interLoaded=true});
    _am.addListener('interstitialAdDismissed', ()=>{_interLoaded=false;_amLoadInter()});
    _am.addListener('interstitialAdFailedToLoad',()=>{_interLoaded=false;setTimeout(_amLoadInter,30000)});

    // ── المكافأة (أسماء رسمية من RewardAdPluginEvents — كلها تبدأ بـ on) ──
    _am.addListener('onRewardedVideoAdLoaded',       ()=>{_rewardLoaded=true});
    _am.addListener('onRewardedVideoAdDismissed',    ()=>{_rewardLoaded=false;_amLoadReward()});
    _am.addListener('onRewardedVideoAdFailedToLoad', ()=>{_rewardLoaded=false;setTimeout(_amLoadReward,30000)});

    // إعلان بيني عند فتح التطبيق — مرة واحدة لكل جلسة
    let _splashShown=false;
    _am.addListener('interstitialAdLoaded',()=>{
      if(_splashShown)return; // يمنع التكرار بشكل مضمون
      _splashShown=true;
      setTimeout(async()=>{
        if(!_interLoaded)return; // تحقق مجدداً قبل العرض
        try{_lessonsAfterAd=0;await _am.showInterstitial()}catch(e){}
      },1500);
    });
    _amLoadInter();
    _amLoadReward();
  }catch(e){}
}

async function _amLoadInter(){
  try{if(_am)await _am.prepareInterstitial({adId:AD.inter,isTesting:IS_TEST})}catch(e){}
}
async function _amLoadReward(){
  try{if(_am)await _am.prepareRewardVideoAd({adId:AD.reward,isTesting:IS_TEST})}catch(e){}
}

// يُستدعى عند إتمام درس — إعلان بيني كل 3 دروس
async function amOnLessonDone(){
  _lessonsAfterAd++;
  if(_lessonsAfterAd<INTER_EVERY||!_interLoaded)return;
  _lessonsAfterAd=0;
  try{await _am.showInterstitial()}catch(e){}
}

// بانر: أظهر في الرئيسية، أخفِ في الدروس
const BANNER_H=60;
let _bannerCreated=false; // هل استدعينا showBanner من قبل؟

function _applyBannerPadding(){
  const nav=document.getElementById('nav');
  if(nav) nav.style.bottom=BANNER_H+'px';
  document.documentElement.style.setProperty('--bh',BANNER_H+'px');
  document.body.style.paddingBottom=`calc(${66+BANNER_H}px + var(--sb))`;
}
function _clearBannerPadding(){
  const nav=document.getElementById('nav');
  if(nav) nav.style.bottom='';
  document.documentElement.style.setProperty('--bh','0px');
  document.body.style.paddingBottom='calc(76px + var(--sb))';
}

async function amBannerShow(){
  if(!_am)return;
  _bannerVisible=true;
  try{
    if(!_bannerCreated){
      // أول مرة فقط: أنشئ البانر وانتظر حدث التحميل لتطبيق الـ padding
      _bannerCreated=true;
      await _am.showBanner({adId:AD.banner,adSize:'ADAPTIVE_BANNER',position:'BOTTOM_CENTER',margin:0,isTesting:IS_TEST});
    } else {
      // البانر موجود مسبقاً — فقط استأنف الإظهار وطبّق الـ padding فوراً
      await _am.resumeBanner();
      // طبّق الـ padding فقط إذا كان الإعلان سبق وتحمّل فعلاً
      if(_bannerLoaded) _applyBannerPadding();
    }
  }catch(e){_bannerVisible=false;}
}
async function amBannerHide(){
  if(!_am||!_bannerCreated)return;
  _bannerVisible=false;
  try{ await _am.hideBanner(); }catch(e){}
  _clearBannerPadding();
}

// مكافأة: يُستدعى عند ضغط زر "شاهد إعلاناً لفتح الدرس"
async function amShowReward(onGranted){
  if(!_am||!_rewardLoaded){toast('الإعلان لم يُحمَّل بعد، انتظر لحظة وحاول مجدداً','warning');return}
  try{
    // أضف المستمع مرة واحدة قبل الإظهار
    const h=await _am.addListener('onRewardedVideoAdReward',()=>{
      h.remove();
      _rewardLoaded=false;
      _amLoadReward();
      onGranted();
    });
    await _am.showRewardVideoAd();
  }catch(e){toast('تعذّر عرض الإعلان، حاول لاحقاً','warning')}
}

amInit();
// ───────────────────────────────────────────────────────────────────

render();
</script>
